services:
  app:
    build: ./app
    restart: unless-stopped
    env_file: .env
    volumes:
      - apartment_data:/app/data
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  apartment_data:
  caddy_data:
  caddy_config:
