# A generic, single database configuration.

[alembic]
# Path to migration scripts — relative to this ini file (app/ directory).
script_location = alembic

# Template used to generate migration files.
file_template = %%(rev)s_%%(slug)s

# sys.path override — alembic adds this to sys.path; env.py handles its own
# sys.path insertion.
# prepend_sys_path = .

# Timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python>=3.9 or backports.zoneinfo library.
# timezone =

# Max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command, regardless
# of autogenerate.
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a source .py file to be
# detected as revisions in the versions/ directory.
# sourceless = false

# Version location specification; This defaults to alembic/versions.
# When using multiple version directories, initial revisions must be specified
# with --version-path.
# version_locations = %(here)s/bar:%(here)s/bat:alembic/versions

# Version path separator; the default within new alembic.ini files is "os",
# which uses os.pathsep. Note that this key is likely not needed for most use
# cases and can be removed.
# version_path_separator = os  # Use os.pathsep. Default configuration used for new projects.
# version_path_separator = :   # colon
# version_path_separator = ;   # semicolon
# version_path_separator = space # space

# The output encoding used when revision files are written from script.py.mako;
# defaults to utf-8.
# output_encoding = utf-8

# sqlalchemy.url left blank — env.py reads DATABASE_URL from config and calls
# alembic_config.set_main_option("sqlalchemy.url", ...) at runtime.
sqlalchemy.url =


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples

# format using "black" - use the console_scripts runner,
# against the "black" entrypoint
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
